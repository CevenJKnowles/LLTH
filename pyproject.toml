[project]
name = "llth"
version = "0.0.0"
description = "LLTH: Liberated Local Thinking Harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.scripts]
llth = "llth.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
